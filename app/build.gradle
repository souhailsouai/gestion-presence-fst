plugins {
    id 'com.android.application'
}

android {
    namespace 'tn.utm.fst.gestionpresence'
    compileSdk 35

    defaultConfig {
        applicationId 'tn.utm.fst.gestionpresence'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.2.1'
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../shared/patch']
        }
    }
}
