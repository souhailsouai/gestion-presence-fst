name: V31 validation

on:
  push:
    branches: [ feature/v31-presence-notes-lpc3 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript unit and regression tests
        run: node --test tests/web/*.test.cjs
      - name: Generate real V31 Excel workbooks
        run: |
          npm install --no-save xlsx@0.18.5
          python -m pip install openpyxl
          node tests/integration/generate-v31-xlsx.cjs artifacts/v31-xlsx
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook
          files=sorted(Path('artifacts/v31-xlsx').glob('*.xlsx'))
          assert len(files) == 8, [p.name for p in files]
          mpi=[p for p in files if 'LPC3' not in p.name]
          lpc=[p for p in files if 'LPC3' in p.name]
          assert len(mpi) == 7, [p.name for p in mpi]
          assert len(lpc) == 1, [p.name for p in lpc]
          for p in files:
              wb=load_workbook(p, data_only=False)
              expected_global=p.name=='Suivi_TP_MPI1_PC1_2026_2027.xlsx'
              if expected_global:
                  assert wb.sheetnames == ['MPI1-A','MPI1-B','MPI1-C','MPI1-D','MPI1-E','PC1-A']
                  ws=wb['MPI1-A']
              else:
                  assert len(wb.sheetnames)==1
                  ws=wb[wb.sheetnames[0]]
              headers=[ws.cell(7,c).value for c in range(1,ws.max_column+1)]
              assert headers[:4] == ['N°','Nom','Prénom','Groupe']
              assert 'Présence %' in headers and 'Absence %' in headers
              assert ws.freeze_panes == 'A8'
              assert ws.auto_filter.ref is not None
              assert ws.sheet_view.showGridLines is False
          lwb=load_workbook(lpc[0], data_only=False)
          values=[cell.value for row in lwb['Suivi'].iter_rows() for cell in row]
          assert 0 in values
          assert any(v=='M1 Statut' for v in values) and any(v=='M2 Statut' for v in values)
          print('validated', [p.name for p in files])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v31-xlsx-integration
          path: artifacts/v31-xlsx/*.xlsx
          retention-days: 7

      - name: Build Pages candidate
        run: python scripts/build_pages_from_41881.py
      - name: Verify V31 candidate modules
        run: |
          grep -q 'v31-config.js' web/index.html
          grep -q 'v31-domain.js' web/index.html
          grep -q 'v31-tracking-xlsx.js' web/index.html
          grep -q 'v31-version-ui.js' web/index.html
          grep -q 'v31-export-ui.js' web/index.html
