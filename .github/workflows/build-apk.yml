name: Build Android APK

on:
  push:
    branches: [ main, build-cross-platform-test, build-cross-platform ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate canonical shared HTML
        run: |
          python scripts/build_shared_html.py
          cp web/index.html app/src/main/assets/index.html
      - name: Verify canonical embedded web application
        run: |
          test -s web/index.html
          test -s app/src/main/assets/index.html
          cmp web/index.html app/src/main/assets/index.html
          grep -q 'viewport-fit=cover' web/index.html
          grep -q 'Changer de compte' web/index.html
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Gestion-Presence-FST-2026-2027.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Presence-FST-Android
          path: Gestion-Presence-FST-2026-2027.apk
          if-no-files-found: error
