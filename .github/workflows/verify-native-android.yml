name: Verify Native Android
on:
  push:
    branches: [ feature/android-native-compose ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify no WebView
        run: |
          ! grep -R "android.webkit.WebView\|file:///android_asset" app-native/src/main --include='*.kt' --include='*.xml'
      - name: Unit tests
        run: gradle :app-native:testDebugUnitTest --stacktrace
      - name: Build native APK
        run: gradle :app-native:assembleDebug --stacktrace
