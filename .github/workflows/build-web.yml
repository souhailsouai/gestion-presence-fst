name: Build Secure Web Application

on:
  push:
    branches: [ main, release/final-cross-platform-2026-2027, 'fix/**' ]
    paths:
      - 'web/**'
      - 'scripts/build_online_web.py'
      - 'scripts/build_single_file_release.py'
      - 'tests/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Web test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify rebuilt JavaScript and contracts
        shell: bash
        run: |
          set -euo pipefail
          for source in web/ui.js web/api.js web/auth.js web/attendance.js web/administration.js web/reports.js web/app-shell.js; do
            node --check "$source"
          done
          for test in tests/web/*.test.cjs; do
            case "$test" in
              *standalone-browser-smoke.test.cjs) continue ;;
            esac
            node "$test"
          done

      - name: Prepare pinned Web dependencies
        run: python scripts/build_online_web.py

      - name: Build standalone Web release
        run: python scripts/build_single_file_release.py

      - name: Verify final Web artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s web/index.html
          test -s dist/web/Gestion-Presence-FST-Web-2026-2027.html
          node tests/web/final-bundle-order.postbuild.cjs
          node tests/web/final-artifact-security.test.cjs
          grep -Fq 'save_attendance_sheet' dist/web/Gestion-Presence-FST-Web-2026-2027.html
          grep -Fq 'VERSION_CONFLICT' dist/web/Gestion-Presence-FST-Web-2026-2027.html
          grep -Fq 'data-testid="login-submit"' dist/web/Gestion-Presence-FST-Web-2026-2027.html
          ! grep -Fq '<script src=' dist/web/Gestion-Presence-FST-Web-2026-2027.html
          sha256sum --check dist/web/SHA256SUMS.txt

      - name: Verify standalone browser startup
        run: node tests/web/standalone-browser-smoke.test.cjs

      - name: Upload secure Web application
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Presence-FST-Web-v2.1.0
          path: |
            dist/web/Gestion-Presence-FST-Web-2026-2027.html
            dist/web/SHA256SUMS.txt
          if-no-files-found: error
