name: Build Secure Web Application

on:
  push:
    branches: [ main, release/final-cross-platform-2026-2027, feature/v5.15-session-selection ]
    paths:
      - 'gestion_presence_tp_theme_institutionnel.html'
      - 'web/**'
      - 'scripts/build_online_web.py'
      - 'scripts/build_single_file_release.py'
      - 'scripts/web-superadmin.patch.part*'
      - 'tests/web/**'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify JavaScript syntax and contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check web/security-v2.js
          node --check web/v515-api.js
          node --check web/v515-teacher-ui.js
          node --check web/v515-admin-ui.js
          node --check web/v515-runtime.js
          node --test tests/web/*.test.cjs

      - name: Build online Web application
        run: python scripts/build_online_web.py

      - name: Build standalone Web release
        run: python scripts/build_single_file_release.py

      - name: Verify final Web artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s web/index.html
          grep -Fq 'data-fst-security-v2="inline"' web/index.html
          grep -Fq 'save_attendance_sheet' web/index.html
          grep -Fq 'challengeAndVerify' web/index.html
          grep -Fq 'VERSION_CONFLICT' web/index.html
          grep -Fq 'window.FSTV515Api=' web/index.html
          grep -Fq 'window.FSTV515TeacherUI=' web/index.html
          grep -Fq 'window.FSTV515AdminUI=' web/index.html
          grep -Fq 'window.FSTV515=' web/index.html
          grep -Fq 'v515_submit_request' web/index.html
          grep -Fq 'v515_finalize_cycle' web/index.html
          ! grep -Fq './security-v2.js' web/index.html
          ! grep -Fq './v515-runtime.js' web/index.html
          mkdir -p dist/web
          cp web/index.html dist/web/Gestion-Presence-FST-Web-v5.15.0.html
          cp gestion_presence_tp_theme_institutionnel.html dist/web/Gestion-Presence-FST-HTML-Reference-2026-2027.html
          sha256sum dist/web/* > dist/web/SHA256SUMS.txt
          sha256sum --check dist/web/SHA256SUMS.txt

      - name: Upload secure Web application
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Presence-FST-Web-v5.15.0
          path: dist/web/**
          if-no-files-found: error
