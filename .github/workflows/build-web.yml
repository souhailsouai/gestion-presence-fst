name: Build Secure Web Application

on:
  push:
    branches: [ main, release/final-cross-platform-2026-2027, 'fix/**' ]
    paths:
      - 'gestion_presence_tp_theme_institutionnel.html'
      - 'web/**'
      - 'scripts/build_online_web.py'
      - 'scripts/build_single_file_release.py'
      - 'scripts/web-superadmin.patch.part*'
      - 'tests/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Web test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify JavaScript syntax and contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check web/security-v2.js
          for test in tests/web/*.test.cjs; do
            case "$test" in
              *standalone-browser-smoke.test.cjs) continue ;;
            esac
            node "$test"
          done

      - name: Build online Web application
        run: python scripts/build_online_web.py

      - name: Build standalone Web release
        run: python scripts/build_single_file_release.py

      - name: Verify final Web artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s web/index.html
          node tests/web/final-bundle-order.postbuild.cjs
          grep -Fq 'data-fst-security-v2="inline"' web/index.html
          grep -Fq 'save_attendance_sheet' web/index.html
          grep -Fq 'VERSION_CONFLICT' web/index.html
          grep -Fq 'data-fst-supabase="inline"' web/index.html
          ! grep -Fq './security-v2.js' web/index.html
          ! grep -Fq 'cdn.jsdelivr.net/npm/@supabase/supabase-js' web/index.html
          ! grep -Fq 'auth.mfa.' web/security-v2.js
          ! grep -Fq 'challengeAndVerify' web/security-v2.js
          mkdir -p dist/web
          cp web/index.html dist/web/Gestion-Presence-FST-Web-2026-2027.html
          cp gestion_presence_tp_theme_institutionnel.html dist/web/Gestion-Presence-FST-HTML-Reference-2026-2027.html
          sha256sum dist/web/* > dist/web/SHA256SUMS.txt
          sha256sum --check dist/web/SHA256SUMS.txt

      - name: Reproduce standalone browser startup
        run: node tests/web/standalone-browser-smoke.test.cjs

      - name: Upload secure Web application
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Presence-FST-Web-v2.0.1
          path: dist/web/**
          if-no-files-found: error
