name: Shared shell validation

on:
  push:
    branches: [fix/shared-responsive-shell]
  pull_request:
    branches: [main]
    paths:
      - 'shared/**'
      - 'scripts/**'
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/ui-shell-validation.yml'

permissions:
  contents: read

concurrency:
  group: shared-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact test sources without Git credentials
        run: git archive --format=tar.gz HEAD > /tmp/fst-shell-sources.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: shared-shell-test-sources
          path: /tmp/fst-shell-sources.tar.gz
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Complete JavaScript regression suite
        run: node --test --test-concurrency=1 tests/web/*.test.cjs
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Build and test the actual Pages payload
        run: |
          python scripts/build_pages_from_41881.py
          python -m unittest discover -s tests/browser -p 'test_fst_shell.py' -v
          python tests/browser/capture_fst_shell.py --artifact web/index.html --out artifacts/ui/pages
      - name: Build and test the standalone Web and Windows HTML
        run: |
          python scripts/build_online_web.py
          python scripts/build_single_file_release.py
          python -m unittest discover -s tests/browser -p 'test_fst_shell.py' -v
          python tests/browser/capture_fst_shell.py --artifact web/index.html --out artifacts/ui/standalone
      - name: Upload offline UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-shell-ui-evidence
          path: artifacts/ui/**
          retention-days: 7
          if-no-files-found: warn
