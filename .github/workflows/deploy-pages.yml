name: Deploy V16 to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'gestion_presence_tp_theme_institutionnel.html'
      - 'web/**'
      - 'shared/mobile.css'
      - 'shared/mobile.js'
      - 'scripts/build_pages_from_41881.py'
      - 'scripts/v16_html_transform.py'
      - 'scripts/web-superadmin.patch.part*'
      - 'tests/web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify JavaScript syntax and contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check web/security-v2.js
          for file in web/v515-*.js web/v16-*.js web/v30-*.js; do
            node --check "$file"
          done
          for test in tests/web/*.test.cjs; do
            node "$test"
          done

      - name: Build Pages from locked 41881 baseline
        run: python scripts/build_pages_from_41881.py

      - name: Verify Pages payload
        shell: bash
        run: |
          set -euo pipefail
          test -s web/index.html
          grep -Fq 'data-fst-security-v2="inline"' web/index.html
          grep -Fq 'data-fst-v16-planning-data="inline"' web/index.html
          grep -Fq 'data-fst-v16-planning-ui="inline"' web/index.html
          grep -Fq './vendor/xlsx.full.min.js' web/index.html
          ! grep -Fq 'data-fst-xlsx-engine="inline"' web/index.html
          ! grep -Fq 'Km(e){var r=e.replace' web/index.html
          grep -Fq './v30-teacher-attendance-fix.js' web/index.html
          grep -Fq './v30-lpc3.js' web/index.html
          grep -Fq 'data-fst-mobile-css="inline"' web/index.html
          grep -Fq 'data-fst-mobile-js="inline"' web/index.html
          grep -Fq 'mobile-lpc3-link' web/v30-lpc3.js
          ! grep -Fq 'v31-app-version-footer' web/index.html
          grep -Fq 'save_attendance_sheet' web/index.html
          grep -Fq 'challengeAndVerify' web/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
