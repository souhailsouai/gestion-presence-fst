name: Materialize V5.15 implementation

on:
  push:
    branches: [ feature/v5.15-session-selection ]
    paths:
      - '.github/workflows/materialize-v515.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v5.15-session-selection
          fetch-depth: 0

      - name: Materialize implementation sources
        run: python scripts/materialize_v515.py

      - name: Verify materialized sources
        shell: bash
        run: |
          set -euo pipefail
          test -s web/v515-api.js
          test -s web/v515-admin-ui.js
          test -s supabase/migrations/20260902190000_v515_planning_schema.sql
          node --check web/v515-api.js
          node --check web/v515-teacher-ui.js
          node --check web/v515-admin-ui.js
          node --check web/v515-runtime.js
          node --test tests/web/v515*.test.cjs
          git diff --check

      - name: Keep workflow files out of Actions-authored commit
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows
          rm -rf .v515
          rm -f scripts/materialize_v515.py

      - name: Create materialized commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'openai-v515-materializer'
          git config user.email 'noreply@openai.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: implement V5.15 planning and session selection'

      - name: Push materialized commit
        shell: bash
        run: git push origin HEAD:feature/v5.15-session-selection
