name: Build Native Windows App

on:
  push:
    branches: [ feature/native-windows-app ]
  pull_request:
    branches: [ fix/session-notes-analytics ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reconstruct verified native source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(
            'windows/native-source-v2/chunk-00-a.b64','windows/native-source-v2/chunk-00-b.b64',
            'windows/native-source-v2/chunk-01.b64','windows/native-source-v2/chunk-02.b64',
            'windows/native-source-v2/chunk-03-a.b64','windows/native-source-v2/chunk-03-b.b64',
            'windows/native-source-v2/chunk-04-a.b64','windows/native-source-v2/chunk-04-b.b64',
            'windows/native-source-v2/chunk-05.b64'
          )
          $encoded = ($parts | ForEach-Object { Get-Content $_ -Raw }) -join ''
          [IO.File]::WriteAllBytes('native-source.tar.gz', [Convert]::FromBase64String($encoded))
          $actual = (Get-FileHash 'native-source.tar.gz' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '24d32902225db387da93a949a8e54df91ab8cdf53a7052d8f44793df3c168ba1') { throw "SHA mismatch $actual" }
          tar -xzf native-source.tar.gz
          pwsh 'windows/native-overrides/apply-compile-fixes.ps1'
      - name: Print auth sources
        shell: pwsh
        run: |
          $files = @(
            'windows/GestionPresenceFST/Services/AuthService.cs',
            'windows/GestionPresenceFST/Services/IAuthService.cs',
            'windows/GestionPresenceFST/ViewModels/LoginViewModel.cs',
            'windows/GestionPresenceFST/Infrastructure/AppComposition.cs',
            'windows/GestionPresenceFST/Data/SupabaseGateway.cs',
            'windows/GestionPresenceFST/Data/ISupabaseGateway.cs',
            'windows/GestionPresenceFST/Security/UserSession.cs',
            'windows/GestionPresenceFST/Windows/LoginWindow.xaml',
            'windows/GestionPresenceFST/Windows/LoginWindow.xaml.cs'
          )
          foreach ($file in $files) {
            Write-Host "===== $file ====="
            if (Test-Path $file) { Get-Content $file -Raw } else { Write-Host 'MISSING' }
          }
          throw 'AUTH_SOURCE_CAPTURE_COMPLETE'
