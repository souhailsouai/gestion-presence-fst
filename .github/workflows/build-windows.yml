name: Build Native Windows App

on:
  push:
    branches: [ feature/native-windows-app ]
  pull_request:
    branches: [ fix/session-notes-analytics ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Reconstruct verified native source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(
            'windows/native-source-v2/chunk-00-a.b64',
            'windows/native-source-v2/chunk-00-b.b64',
            'windows/native-source-v2/chunk-01.b64',
            'windows/native-source-v2/chunk-02.b64',
            'windows/native-source-v2/chunk-03-a.b64',
            'windows/native-source-v2/chunk-03-b.b64',
            'windows/native-source-v2/chunk-04-a.b64',
            'windows/native-source-v2/chunk-04-b.b64',
            'windows/native-source-v2/chunk-05.b64'
          )
          foreach ($part in $parts) { if (-not (Test-Path $part)) { throw "Missing source fragment: $part" } }
          $encoded = ($parts | ForEach-Object { Get-Content $_ -Raw }) -join ''
          [IO.File]::WriteAllBytes('native-source.tar.gz', [Convert]::FromBase64String($encoded))
          $actual = (Get-FileHash 'native-source.tar.gz' -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '24d32902225db387da93a949a8e54df91ab8cdf53a7052d8f44793df3c168ba1'
          if ($actual -ne $expected) { throw "Native source SHA256 mismatch: $actual" }
          tar -xzf native-source.tar.gz
          Copy-Item 'windows/native-overrides/ImportExportService.cs' 'windows/GestionPresenceFST/Services/ImportExportService.cs' -Force
          Copy-Item 'windows/native-overrides/PdfService.cs' 'windows/GestionPresenceFST/Services/PdfService.cs' -Force
          pwsh 'windows/native-overrides/apply-compile-fixes.ps1'
      - name: Diagnose PIN authentication flow
        shell: pwsh
        run: |
          Write-Host '=== Native PIN references ==='
          Get-ChildItem 'windows/GestionPresenceFST' -Recurse -File -Include *.cs,*.xaml |
            Select-String -Pattern 'pin|PIN|incorrect|auth|login|signIn|SignIn|credential|admin-pin-login' -Context 5,5 |
            ForEach-Object { $_.ToString() }
          Write-Host '=== Web PIN references ==='
          Select-String -Path 'gestion_presence_tp_theme_institutionnel.html' -Pattern 'pin|PIN|incorrect|auth|login|signIn|SignIn|credential|admin-pin-login' -Context 5,5 |
            Select-Object -First 300 |
            ForEach-Object { $_.ToString() }
          throw 'DIAGNOSTIC_COMPLETE'
