name: Build Windows

on:
  push:
    branches:
      - feature/windows-offline-sync
      - main
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Rebuild approved shared HTML baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path web | Out-Null
          Copy-Item gestion_presence_tp_theme_institutionnel.html web/index.html -Force
          $b64 = Get-Content scripts/web-superadmin.patch.gz.b64 -Raw
          $gzPath = Join-Path $env:RUNNER_TEMP 'web-superadmin.patch.gz'
          $patchPath = Join-Path $env:RUNNER_TEMP 'web-superadmin.patch'
          [IO.File]::WriteAllBytes($gzPath, [Convert]::FromBase64String($b64.Trim()))
          $input = [IO.File]::OpenRead($gzPath)
          $gzip = [IO.Compression.GzipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
          $output = [IO.File]::Create($patchPath)
          $gzip.CopyTo($output)
          $output.Dispose(); $gzip.Dispose(); $input.Dispose()
          git apply --whitespace=nowarn $patchPath
      - name: Restore tests
        run: dotnet restore windows/GestionPresenceFST.Tests/GestionPresenceFST.Tests.csproj
      - name: Run tests
        run: dotnet test windows/GestionPresenceFST.Tests/GestionPresenceFST.Tests.csproj --configuration Release --no-restore
      - name: Publish Windows x64
        if: success()
        run: dotnet publish windows/GestionPresenceFST/GestionPresenceFST.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/windows-x64
      - name: Upload Windows artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Presence-FST-Windows-x64
          path: publish/windows-x64
