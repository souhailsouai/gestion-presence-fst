name: Build Native Windows App

on:
  push:
    branches: [ feature/native-windows-app ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore windows/GestionPresenceFST/GestionPresenceFST.csproj
      - name: Test
        run: dotnet test windows/GestionPresenceFST.Tests/GestionPresenceFST.Tests.csproj -c Release
      - name: Build native WPF shell
        run: dotnet build windows/GestionPresenceFST/GestionPresenceFST.csproj -c Release --no-restore
