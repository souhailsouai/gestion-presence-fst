name: Build Windows Private

on:
  push:
    branches:
      - feature/windows-online-realtime
      - main
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build final embedded HTML
        run: |
          python scripts/build_online_web.py
          python scripts/build_single_file_release.py
      - name: Test shared web and PDF generation
        run: node --test tests/web/*.test.cjs
      - name: Upload final HTML
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Presence-FST-HTML-Final
          path: web/index.html
      - name: Restore Windows tests
        run: dotnet restore windows/GestionPresenceFST.Tests/GestionPresenceFST.Tests.csproj
      - name: Test Windows host
        run: dotnet test windows/GestionPresenceFST.Tests/GestionPresenceFST.Tests.csproj --configuration Release --no-restore
      - name: Publish Windows x64 single file
        if: success()
        run: dotnet publish windows/GestionPresenceFST/GestionPresenceFST.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish/windows-x64
      - name: Smoke-test Windows executable startup
        if: success()
        shell: pwsh
        run: |
          $exe = Resolve-Path 'publish/windows-x64/Gestion-Presence-FST.exe'
          $start = Get-Date
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            Write-Host "Executable exited during startup with code $($process.ExitCode)."
            Write-Host 'Recent Application log entries:'
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$start.AddSeconds(-2)} -ErrorAction SilentlyContinue |
              Select-Object -First 20 TimeCreated, ProviderName, Id, LevelDisplayName, Message |
              Format-List
            exit 1
          }
          Stop-Process -Id $process.Id -Force
          Write-Host 'Executable remained active for 8 seconds.'
      - name: Upload Windows executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Presence-FST-Windows-x64
          path: publish/windows-x64/Gestion-Presence-FST.exe
