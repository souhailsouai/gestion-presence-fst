name: Build Synchronized Windows Application

on:
  push:
    branches: [ main, release/final-cross-platform-2026-2027, feature/v5.15-session-selection ]
    paths:
      - 'windows/GestionPresenceFSTOnline/**'
      - 'web/**'
      - 'gestion_presence_tp_theme_institutionnel.html'
      - 'scripts/build_online_web.py'
      - 'scripts/build_single_file_release.py'
      - 'scripts/web-superadmin.patch.part*'
      - 'tests/web/**'
      - '.github/workflows/build-windows-online.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-online-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify Web security and V5.15 contracts
        shell: pwsh
        run: |
          node --check web/security-v2.js
          node --check web/v515-api.js
          node --check web/v515-teacher-ui.js
          node --check web/v515-admin-ui.js
          node --check web/v515-runtime.js
          node --test tests/web/*.test.cjs

      - name: Build embedded Web application
        shell: pwsh
        run: |
          python scripts/build_online_web.py
          python scripts/build_single_file_release.py
          if (-not (Select-String -Path web/index.html -Pattern 'data-fst-security-v2="inline"' -Quiet)) { throw 'Security runtime missing' }
          if (-not (Select-String -Path web/index.html -Pattern 'save_attendance_sheet' -Quiet)) { throw 'V2 attendance RPC missing' }
          if (-not (Select-String -Path web/index.html -Pattern 'window.FSTV515=' -Quiet)) { throw 'V5.15 runtime missing' }
          if (-not (Select-String -Path web/index.html -Pattern 'v515_finalize_cycle' -Quiet)) { throw 'V5.15 finalization RPC missing' }

      - name: Restore and compile Windows project
        shell: pwsh
        run: |
          dotnet restore windows/GestionPresenceFSTOnline/GestionPresenceFSTOnline.csproj
          dotnet build windows/GestionPresenceFSTOnline/GestionPresenceFSTOnline.csproj -c Release --no-restore

      - name: Publish portable Windows application
        shell: pwsh
        run: |
          dotnet publish windows/GestionPresenceFSTOnline/GestionPresenceFSTOnline.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -o dist/windows/publish
          $exe = Get-ChildItem dist/windows/publish/Gestion-Presence-FST-Windows.exe
          if (-not $exe -or $exe.Length -lt 1000000) { throw 'Windows executable missing or invalid' }
          Copy-Item $exe.FullName dist/windows/Gestion-Presence-FST-Windows-v5.15.0.exe
          Compress-Archive -Path dist/windows/publish/* -DestinationPath dist/windows/Gestion-Presence-FST-Windows-v5.15.0.zip -Force
          Get-FileHash dist/windows/Gestion-Presence-FST-Windows-v5.15.0.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Gestion-Presence-FST-Windows-v5.15.0.exe" } | Set-Content dist/windows/SHA256SUMS.txt

      - name: Upload synchronized Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Presence-FST-Windows-v5.15.0
          path: |
            dist/windows/Gestion-Presence-FST-Windows-v5.15.0.exe
            dist/windows/Gestion-Presence-FST-Windows-v5.15.0.zip
            dist/windows/SHA256SUMS.txt
          if-no-files-found: error
